# As duas imagens do MAM (#71), pelo scripts/deploy-dev.sh. O Cloud Build as envia
# ao Artifact Registry, e o script publica pelos digests delas, sem rebuild.
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, $_WEB, --build-arg, VITE_IDENTITY_API_KEY=$_VITE_IDENTITY_API_KEY, .]
  - name: gcr.io/cloud-builders/docker
    args: [build, --target, validacao, -t, $_VALIDACAO, .]
images: [$_WEB, $_VALIDACAO]
options:
  # Obrigatório com conta de serviço própria (mam-build).
  logging: CLOUD_LOGGING_ONLY
