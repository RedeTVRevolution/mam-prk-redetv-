# Workflows da validação (#38): recebe o evento do Eventarc (upload completo na
# quarentena), roda o Job de validação e, se a execução falhar, marca o Job como
# falhou, salvo se estiver cancelado. Depois, só se o Job ficou em `analisando`, roda o
# Job de transcrição, o de OCR da tela e o de análise. A análise é um Job, e não uma
# chamada HTTP, porque passa do teto de 1800 s da chamada do Workflows (#127).
# Carregado por templatefile: ${projeto}, ${regiao}, ${job_de_validacao},
# ${job_de_transcricao}, ${job_de_ocr}, ${job_de_analise}.
main:
  params: [evento]
  steps:
    - tira_o_id:
        assign:
          # O objeto na quarentena tem o nome do id do Job.
          - job_id: $${evento.data.name}
    - valida:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: projects/${projeto}/locations/${regiao}/jobs/${job_de_validacao}
            body:
              overrides:
                containerOverrides:
                  - env:
                      - name: JOB_ID
                        value: $${job_id}
            # O conector desiste em 1800 s por padrão; o Job de validação tem até 10800 s.
            connector_params:
              timeout: 11100
        except:
          as: e
          # Tempo esgotado ou memória estourada: o Job não chegou a gravar o resultado.
          steps:
            - le_antes_de_marcar:
                try:
                  call: googleapis.firestore.v1.projects.databases.documents.get
                  args:
                    name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                  result: antes
                except:
                  as: erro_da_leitura
                  steps:
                    # Um objeto sem Job correspondente não cria documento.
                    - sem_job_para_marcar:
                        switch:
                          - condition: $${erro_da_leitura.code == 404}
                            next: encerra_com_falha
                    - repassa_o_erro_da_releitura:
                        raise: $${erro_da_leitura}
            # Um Job cancelado continua cancelado (#51).
            - nao_sobrescreve_cancelado:
                switch:
                  - condition: $${antes.fields.estado.stringValue == "cancelado"}
                    next: encerra_com_falha
            - marca_como_falhou:
                call: googleapis.firestore.v1.projects.databases.documents.patch
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                  # Só vale se o Job não mudou desde a leitura (um cancelamento no meio).
                  currentDocument:
                    updateTime: $${antes.updateTime}
                  updateMask:
                    fieldPaths: [estado, codigo_falha, atualizado_em]
                  body:
                    fields:
                      estado:
                        stringValue: falhou
                      codigo_falha:
                        stringValue: arquivo_corrompido
                      atualizado_em:
                        timestampValue: $${time.format(sys.now())}
            - encerra_com_falha:
                raise: $${e}
    - le_o_job:
        try:
          call: googleapis.firestore.v1.projects.databases.documents.get
          args:
            name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
          result: documento
        except:
          as: e
          steps:
            # Um objeto sem Job correspondente não tem o que analisar.
            - sem_job:
                switch:
                  - condition: $${e.code == 404}
                    next: fim
            - repassa_o_erro_da_leitura:
                raise: $${e}
    - so_se_analisando:
        switch:
          - condition: $${documento.fields.estado.stringValue == "analisando"}
            next: transcreve
        next: fim
    - transcreve:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: projects/${projeto}/locations/${regiao}/jobs/${job_de_transcricao}
            body:
              overrides:
                containerOverrides:
                  - env:
                      - name: JOB_ID
                        value: $${job_id}
            # O conector desiste em 1800 s por padrão; o Job de transcrição tem até 21600 s.
            connector_params:
              timeout: 21900
        except:
          as: e
          steps:
            # O Job de transcrição já derruba o Job pelo ciclo de vida; aqui cobre o que
            # o impediu de chegar lá (tempo esgotado, memória estourada). Só marca se o
            # Job segue em `analisando` e não mudou desde a leitura.
            - rele_antes_da_transcricao:
                call: googleapis.firestore.v1.projects.databases.documents.get
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                result: durante
            - so_se_ainda_analisando_na_transcricao:
                switch:
                  - condition: $${durante.fields.estado.stringValue != "analisando"}
                    next: encerra_a_transcricao_com_falha
            - marca_transcricao_como_falha:
                call: googleapis.firestore.v1.projects.databases.documents.patch
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                  currentDocument:
                    updateTime: $${durante.updateTime}
                  updateMask:
                    fieldPaths: [estado, codigo_falha, atualizado_em]
                  body:
                    fields:
                      estado:
                        stringValue: falhou
                      codigo_falha:
                        stringValue: transcricao_falhou
                      atualizado_em:
                        timestampValue: $${time.format(sys.now())}
            - encerra_a_transcricao_com_falha:
                raise: $${e}
    - le_a_tela:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: projects/${projeto}/locations/${regiao}/jobs/${job_de_ocr}
            body:
              overrides:
                containerOverrides:
                  - env:
                      - name: JOB_ID
                        value: $${job_id}
            # O conector desiste em 1800 s por padrão; o Job de OCR tem até 28800 s.
            connector_params:
              timeout: 29100
        except:
          as: e
          steps:
            # O Job de OCR já derruba o Job pelo ciclo de vida; aqui cobre o que
            # o impediu de chegar lá (tempo esgotado, memória estourada). Só marca se o
            # Job segue em `analisando` e não mudou desde a leitura.
            - rele_antes_do_ocr:
                call: googleapis.firestore.v1.projects.databases.documents.get
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                result: durante_o_ocr
            - so_se_ainda_analisando_no_ocr:
                switch:
                  - condition: $${durante_o_ocr.fields.estado.stringValue != "analisando"}
                    next: encerra_o_ocr_com_falha
            - marca_ocr_como_falha:
                call: googleapis.firestore.v1.projects.databases.documents.patch
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                  currentDocument:
                    updateTime: $${durante_o_ocr.updateTime}
                  updateMask:
                    fieldPaths: [estado, codigo_falha, atualizado_em]
                  body:
                    fields:
                      estado:
                        stringValue: falhou
                      codigo_falha:
                        stringValue: ocr_falhou
                      atualizado_em:
                        timestampValue: $${time.format(sys.now())}
            - encerra_o_ocr_com_falha:
                raise: $${e}
    - analisa:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: projects/${projeto}/locations/${regiao}/jobs/${job_de_analise}
            body:
              overrides:
                containerOverrides:
                  - env:
                      - name: JOB_ID
                        value: $${job_id}
            # O conector desiste em 1800 s por padrão; o Job de análise tem até 21600 s
            # (as janelas de um programa de até 4 h, a Flex com 600 s por chamada).
            connector_params:
              timeout: 21900
        except:
          as: e
          steps:
            # O Job de análise já trata a falha da análise (o Job vai a `falhou`); aqui
            # cobre o que o impediu de chegar lá (tempo esgotado, memória estourada).
            # Só marca se o Job segue em `analisando` e não mudou desde a leitura.
            - rele_o_job:
                call: googleapis.firestore.v1.projects.databases.documents.get
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                result: atual
            - so_se_ainda_analisando:
                switch:
                  - condition: $${atual.fields.estado.stringValue != "analisando"}
                    next: encerra_a_analise_com_falha
            - marca_analise_como_falha:
                call: googleapis.firestore.v1.projects.databases.documents.patch
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                  currentDocument:
                    updateTime: $${atual.updateTime}
                  updateMask:
                    fieldPaths: [estado, codigo_falha, atualizado_em]
                  body:
                    fields:
                      estado:
                        stringValue: falhou
                      codigo_falha:
                        stringValue: analise_falhou
                      atualizado_em:
                        timestampValue: $${time.format(sys.now())}
            - encerra_a_analise_com_falha:
                raise: $${e}
    - fim:
        return: $${job_id}
