# Workflows da validação (#38): recebe o evento do Eventarc (upload completo na
# quarentena), roda o Job de validação e, se a execução falhar, marca o Job como
# falhou, salvo se estiver cancelado. Depois, só se o Job ficou em `analisando`, roda o
# Job de transcrição, o de OCR da tela e o de análise. Por último vem o Job dos quadros-chave
# (#115), sem internet: se ele falha, o Job de análise já concluiu e a falha só vai ao log. A análise é um Job, e não uma
# chamada HTTP, porque passa do teto de 1800 s da chamada do Workflows (#127).
# Carregado por templatefile: ${projeto}, ${regiao}, ${job_de_validacao},
# ${job_de_transcricao}, ${job_de_ocr}, ${job_de_analise}, ${job_de_quadros}.
main:
  params: [evento]
  steps:
    - tira_o_id:
        assign:
          # O objeto na quarentena tem o nome do id do Job.
          - job_id: $${evento.data.name}
    - inicia_validacao:
        call: marca_inicio
        args:
          job_id: $${job_id}
          etapa: validacao
    - valida:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: projects/${projeto}/locations/${regiao}/jobs/${job_de_validacao}
            body:
              overrides:
                containerOverrides:
                  - env:
                      - name: JOB_ID
                        value: $${job_id}
            # O conector desiste em 1800 s por padrão; o Job de validação tem até 10800 s.
            connector_params:
              timeout: 11100
        except:
          as: e
          # Tempo esgotado ou memória estourada: o Job não chegou a gravar o resultado.
          steps:
            - grava_a_falha_de_validacao:
                call: marca_fim
                args:
                  job_id: $${job_id}
                  etapa: validacao
                  falhou_na_execucao: true
            - le_antes_de_marcar:
                try:
                  call: googleapis.firestore.v1.projects.databases.documents.get
                  args:
                    name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                  result: antes
                except:
                  as: erro_da_leitura
                  steps:
                    # Um objeto sem Job correspondente não cria documento.
                    - sem_job_para_marcar:
                        switch:
                          - condition: $${erro_da_leitura.code == 404}
                            next: encerra_com_falha
                    - repassa_o_erro_da_releitura:
                        raise: $${erro_da_leitura}
            # Um Job cancelado continua cancelado (#51).
            - nao_sobrescreve_cancelado:
                switch:
                  - condition: $${antes.fields.estado.stringValue == "cancelado"}
                    next: encerra_com_falha
            - marca_como_falhou:
                call: googleapis.firestore.v1.projects.databases.documents.patch
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                  # Só vale se o Job não mudou desde a leitura (um cancelamento no meio).
                  currentDocument:
                    updateTime: $${antes.updateTime}
                  updateMask:
                    fieldPaths: [estado, codigo_falha, atualizado_em]
                  body:
                    fields:
                      estado:
                        stringValue: falhou
                      codigo_falha:
                        stringValue: arquivo_corrompido
                      atualizado_em:
                        timestampValue: $${time.format(sys.now())}
            - encerra_com_falha:
                raise: $${e}
    - encerra_validacao:
        call: marca_fim
        args:
          job_id: $${job_id}
          etapa: validacao
          falhou_na_execucao: false
    - le_o_job:
        try:
          call: googleapis.firestore.v1.projects.databases.documents.get
          args:
            name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
          result: documento
        except:
          as: e
          steps:
            # Um objeto sem Job correspondente não tem o que analisar.
            - sem_job:
                switch:
                  - condition: $${e.code == 404}
                    next: fim
            - repassa_o_erro_da_leitura:
                raise: $${e}
    - so_se_analisando:
        switch:
          - condition: $${documento.fields.estado.stringValue == "analisando"}
            next: inicia_transcricao
        next: fim
    - inicia_transcricao:
        call: marca_inicio
        args:
          job_id: $${job_id}
          etapa: transcricao
    - transcreve:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: projects/${projeto}/locations/${regiao}/jobs/${job_de_transcricao}
            body:
              overrides:
                containerOverrides:
                  - env:
                      - name: JOB_ID
                        value: $${job_id}
            # O conector desiste em 1800 s por padrão; o Job de transcrição tem até 21600 s.
            connector_params:
              timeout: 21900
        except:
          as: e
          steps:
            - grava_a_falha_de_transcricao:
                call: marca_fim
                args:
                  job_id: $${job_id}
                  etapa: transcricao
                  falhou_na_execucao: true
            # O Job de transcrição já derruba o Job pelo ciclo de vida; aqui cobre o que
            # o impediu de chegar lá (tempo esgotado, memória estourada). Só marca se o
            # Job segue em `analisando` e não mudou desde a leitura.
            - rele_antes_da_transcricao:
                call: googleapis.firestore.v1.projects.databases.documents.get
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                result: durante
            - so_se_ainda_analisando_na_transcricao:
                switch:
                  - condition: $${durante.fields.estado.stringValue != "analisando"}
                    next: encerra_a_transcricao_com_falha
            - marca_transcricao_como_falha:
                call: googleapis.firestore.v1.projects.databases.documents.patch
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                  currentDocument:
                    updateTime: $${durante.updateTime}
                  updateMask:
                    fieldPaths: [estado, codigo_falha, atualizado_em]
                  body:
                    fields:
                      estado:
                        stringValue: falhou
                      codigo_falha:
                        stringValue: transcricao_falhou
                      atualizado_em:
                        timestampValue: $${time.format(sys.now())}
            - encerra_a_transcricao_com_falha:
                raise: $${e}
    - encerra_transcricao:
        call: marca_fim
        args:
          job_id: $${job_id}
          etapa: transcricao
          falhou_na_execucao: false
    - inicia_leitura_da_tela:
        call: marca_inicio
        args:
          job_id: $${job_id}
          etapa: leitura_da_tela
    - le_a_tela:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: projects/${projeto}/locations/${regiao}/jobs/${job_de_ocr}
            body:
              overrides:
                containerOverrides:
                  - env:
                      - name: JOB_ID
                        value: $${job_id}
            # O conector desiste em 1800 s por padrão; o Job de OCR tem até 28800 s.
            connector_params:
              timeout: 29100
        except:
          as: e
          steps:
            - grava_a_falha_de_leitura_da_tela:
                call: marca_fim
                args:
                  job_id: $${job_id}
                  etapa: leitura_da_tela
                  falhou_na_execucao: true
            # O Job de OCR já derruba o Job pelo ciclo de vida; aqui cobre o que
            # o impediu de chegar lá (tempo esgotado, memória estourada). Só marca se o
            # Job segue em `analisando` e não mudou desde a leitura.
            - rele_antes_do_ocr:
                call: googleapis.firestore.v1.projects.databases.documents.get
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                result: durante_o_ocr
            - so_se_ainda_analisando_no_ocr:
                switch:
                  - condition: $${durante_o_ocr.fields.estado.stringValue != "analisando"}
                    next: encerra_o_ocr_com_falha
            - marca_ocr_como_falha:
                call: googleapis.firestore.v1.projects.databases.documents.patch
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                  currentDocument:
                    updateTime: $${durante_o_ocr.updateTime}
                  updateMask:
                    fieldPaths: [estado, codigo_falha, atualizado_em]
                  body:
                    fields:
                      estado:
                        stringValue: falhou
                      codigo_falha:
                        stringValue: ocr_falhou
                      atualizado_em:
                        timestampValue: $${time.format(sys.now())}
            - encerra_o_ocr_com_falha:
                raise: $${e}
    - encerra_leitura_da_tela:
        call: marca_fim
        args:
          job_id: $${job_id}
          etapa: leitura_da_tela
          falhou_na_execucao: false
    - inicia_analise:
        call: marca_inicio
        args:
          job_id: $${job_id}
          etapa: analise
    - analisa:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: projects/${projeto}/locations/${regiao}/jobs/${job_de_analise}
            body:
              overrides:
                containerOverrides:
                  - env:
                      - name: JOB_ID
                        value: $${job_id}
            # O conector desiste em 1800 s por padrão; o Job de análise tem até 21600 s
            # (as janelas de um programa de até 4 h, a Flex com 600 s por chamada).
            connector_params:
              timeout: 21900
        except:
          as: e
          steps:
            - grava_a_falha_de_analise:
                call: marca_fim
                args:
                  job_id: $${job_id}
                  etapa: analise
                  falhou_na_execucao: true
            # O Job de análise já trata a falha da análise (o Job vai a `falhou`); aqui
            # cobre o que o impediu de chegar lá (tempo esgotado, memória estourada).
            # Só marca se o Job segue em `analisando` e não mudou desde a leitura.
            - rele_o_job:
                call: googleapis.firestore.v1.projects.databases.documents.get
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                result: atual
            - so_se_ainda_analisando:
                switch:
                  - condition: $${atual.fields.estado.stringValue != "analisando"}
                    next: encerra_a_analise_com_falha
            - marca_analise_como_falha:
                call: googleapis.firestore.v1.projects.databases.documents.patch
                args:
                  name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
                  currentDocument:
                    updateTime: $${atual.updateTime}
                  updateMask:
                    fieldPaths: [estado, codigo_falha, atualizado_em]
                  body:
                    fields:
                      estado:
                        stringValue: falhou
                      codigo_falha:
                        stringValue: analise_falhou
                      atualizado_em:
                        timestampValue: $${time.format(sys.now())}
            - encerra_a_analise_com_falha:
                raise: $${e}
    - encerra_analise:
        call: marca_fim
        args:
          job_id: $${job_id}
          etapa: analise
          falhou_na_execucao: false
    - le_o_job_depois_da_analise:
        call: googleapis.firestore.v1.projects.databases.documents.get
        args:
          name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
        result: depois_da_analise
    # Quadros-chave e indexação só valem com o Job `concluido`; uma análise que derrubou
    # o Job (sai sem erro) não as inicia.
    - so_se_concluido:
        switch:
          - condition: $${depois_da_analise.fields.estado.stringValue == "concluido"}
            next: inicia_quadros_chave
        next: fim
    - inicia_quadros_chave:
        call: marca_inicio
        args:
          job_id: $${job_id}
          etapa: quadros_chave
    - tira_os_quadros:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: projects/${projeto}/locations/${regiao}/jobs/${job_de_quadros}
            body:
              overrides:
                containerOverrides:
                  - env:
                      - name: JOB_ID
                        value: $${job_id}
            # O conector desiste em 1800 s por padrão; o Job de quadros tem até 3600 s.
            connector_params:
              timeout: 3900
        except:
          as: e
          steps:
            - grava_a_falha_de_quadros_chave:
                call: marca_fim
                args:
                  job_id: $${job_id}
                  etapa: quadros_chave
                  falhou_na_execucao: true
            # O Job já está concluído; sem os JPEGs a Decupagem segue valendo.
            - registra_a_falha_dos_quadros:
                call: sys.log
                args:
                  severity: WARNING
                  text: $${"quadros-chave falharam para " + job_id}
    - encerra_quadros_chave:
        call: marca_fim
        args:
          job_id: $${job_id}
          etapa: quadros_chave
          falhou_na_execucao: false
    - inicia_indexacao:
        call: marca_inicio
        args:
          job_id: $${job_id}
          etapa: indexacao
    - indexa:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: projects/${projeto}/locations/${regiao}/jobs/${job_de_indexacao}
            body:
              overrides:
                containerOverrides:
                  - env:
                      - name: JOB_ID
                        value: $${job_id}
            # O conector desiste em 1800 s por padrão; o Job de indexação tem até 1800 s.
            connector_params:
              timeout: 2100
        except:
          as: e
          steps:
            - grava_a_falha_de_indexacao:
                call: marca_fim
                args:
                  job_id: $${job_id}
                  etapa: indexacao
                  falhou_na_execucao: true
            # O Job já está concluído; a falha fica no estado da indexação e no log.
            - registra_a_falha_da_indexacao:
                call: sys.log
                args:
                  severity: WARNING
                  text: $${"indexação falhou para " + job_id}
    - encerra_indexacao:
        call: marca_fim
        args:
          job_id: $${job_id}
          etapa: indexacao
          falhou_na_execucao: false
    - fim:
        return: $${job_id}

# Tempo de cada etapa (#146): o início e o fim vão para `etapas.<nome>` do Job, com o
# mesmo formato de `api.ciclo_de_vida`. Não é transição: não mexe em `estado`. Uma falha
# aqui só vai ao log, para a medição nunca derrubar o processamento; o `exists: true`
# faz um objeto sem Job correspondente não criar documento.
marca_inicio:
  params: [job_id, etapa]
  steps:
    - monta_o_inicio:
        assign:
          - agora: $${time.format(sys.now())}
          - por_etapa: {}
          - por_etapa[etapa]:
              mapValue:
                fields:
                  inicio:
                    timestampValue: $${agora}
    - grava_o_inicio:
        try:
          call: googleapis.firestore.v1.projects.databases.documents.patch
          args:
            name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
            currentDocument:
              exists: true
            updateMask:
              fieldPaths: $${["etapa_atual", "etapas." + etapa, "atualizado_em"]}
            body:
              fields:
                etapa_atual:
                  stringValue: $${etapa}
                etapas:
                  mapValue:
                    fields: $${por_etapa}
                atualizado_em:
                  timestampValue: $${agora}
        except:
          as: erro_do_inicio
          steps:
            - registra_o_erro_do_inicio:
                call: sys.log
                args:
                  severity: WARNING
                  text: $${"início da etapa " + etapa + " não gravado para " + job_id}
    - fim_do_inicio:
        return: null

marca_fim:
  params: [job_id, etapa, falhou_na_execucao]
  steps:
    - le_o_estado:
        try:
          call: googleapis.firestore.v1.projects.databases.documents.get
          args:
            name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
          result: documento_da_etapa
        except:
          as: erro_da_leitura_da_etapa
          steps:
            - registra_o_erro_da_leitura:
                call: sys.log
                args:
                  severity: WARNING
                  text: $${"fim da etapa " + etapa + " não gravado para " + job_id}
            - sai_sem_gravar:
                return: null
    - decide_o_resultado:
        assign:
          # Os Jobs de validação e de análise terminam sem erro quando derrubam o Job
          # pelo ciclo de vida: o resultado vem do estado, e não só da execução.
          - resultado: concluida
    - confere_a_execucao:
        switch:
          - condition: $${falhou_na_execucao or documento_da_etapa.fields.estado.stringValue == "falhou"}
            assign:
              - resultado: falhou
    - monta_o_fim:
        assign:
          - agora: $${time.format(sys.now())}
          - por_etapa: {}
          - por_etapa[etapa]:
              mapValue:
                fields:
                  fim:
                    timestampValue: $${agora}
                  resultado:
                    stringValue: $${resultado}
    - grava_o_fim:
        try:
          call: googleapis.firestore.v1.projects.databases.documents.patch
          args:
            name: $${"projects/${projeto}/databases/(default)/documents/jobs/" + job_id}
            currentDocument:
              exists: true
            updateMask:
              fieldPaths: $${["etapa_atual", "etapas." + etapa + ".fim", "etapas." + etapa + ".resultado", "atualizado_em"]}
            body:
              fields:
                etapas:
                  mapValue:
                    fields: $${por_etapa}
                atualizado_em:
                  timestampValue: $${agora}
        except:
          as: erro_do_fim
          steps:
            - registra_o_erro_do_fim:
                call: sys.log
                args:
                  severity: WARNING
                  text: $${"fim da etapa " + etapa + " não gravado para " + job_id}
    - fim_do_fim:
        return: null
