[project]
name = "mam-redetv"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.1",
    "pillow>=13.0.0",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
 # Não é typosquat: fork do httpx mantido pelo Pydantic, exigido pelo
 # TestClient do Starlette. https://github.com/pydantic/httpx2
 "httpx2>=2.16.0",
 "hypothesis>=6.170.13",
 "mypy",
 "pytest",
 "ruff",
]
transcricao = [
    "faster-whisper==1.2.1",
    # O faster-whisper 1.2.1 pede av>=11, mas chama av.open(metadata_errors=...),
    # que o PyAV 19 removeu.
    "av==18.1.0",
]
ocr = [
    "paddleocr==3.7.0",
    # O 3.3 quebra na inferência pelo oneDNN, em CPU, com os modelos PP-OCRv5:
    # ConvertPirAttribute2RuntimeAttribute not support [pir::ArrayAttribute<pir::DoubleAttribute>].
    "paddlepaddle==3.2.2",
]
# Imagem do Job de transcrição com GPU (E1): as bibliotecas CUDA 12 e cuDNN 9 que o
# CTranslate2 4 pede, como rodas do PyPI, para o driver 580 do Cloud Run rodá-las.
transcricao-gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]
# Imagem do Job de OCR com GPU: a mesma versão do `ocr` (3.2.2), mas a roda com CUDA 12.6,
# do índice do próprio Paddle. O oneDNN que quebra no 3.3 é do caminho em CPU, que a
# GPU não usa. As duas rodas dão o mesmo módulo `paddle`: nunca juntas.
ocr-gpu = [
    "paddleocr==3.7.0",
    "paddlepaddle-gpu==3.2.2",
]

[tool.uv]
package = false
conflicts = [
    [{ group = "ocr" }, { group = "ocr-gpu" }],
]

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126", group = "ocr-gpu" }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["api"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["google.cloud.storage", "google.cloud.storage.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "ctranslate2", "paddle", "paddle.*", "paddleocr", "paddleocr.*", "cv2"]
ignore_missing_imports = true
