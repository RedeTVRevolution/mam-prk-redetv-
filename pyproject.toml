[project]
name = "mam-redetv"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.1",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
 # Não é typosquat: fork do httpx mantido pelo Pydantic, exigido pelo
 # TestClient do Starlette. https://github.com/pydantic/httpx2
 "httpx2>=2.16.0",
 "hypothesis>=6.170.13",
 "mypy",
 "pytest",
 "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["api"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["google.cloud.storage", "google.cloud.storage.*"]
ignore_missing_imports = true
