name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instala o ffmpeg (os testes do validador usam o real)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Sobe os emuladores do Firestore e do Storage (testes de api/tests/test_nuvem.py)
        run: |
          # Sem -public-host, o fake-gcs só atende URL assinada com Host storage.googleapis.com.
          docker run -d --name fake-gcs -p 4443:4443 fsouza/fake-gcs-server:1.52.2 \
            -scheme http -port 4443 -public-host localhost:4443
          docker run -d --name firestore -p 8686:8686 google/cloud-sdk:591.0.0-emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8686
          for i in $(seq 60); do
            curl -sf localhost:4443/storage/v1/b && curl -sf localhost:8686 && exit 0
            sleep 2
          done
          echo "Emuladores não subiram em 2 minutos" && docker logs fake-gcs; docker logs firestore; exit 1
      - run: make instalar verificar
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8686
          STORAGE_EMULATOR_HOST: http://localhost:4443

  terraform:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra validate

  loop-afk:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make testar-afk

  gitleaks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instala o gitleaks 8.30.1
        run: |
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c
          tar xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner

  # CD (#71): com o CI verde num push na main, publica no dev pelo mesmo `make
  # deploy-dev` de quem publica à mão. Sem chave: o GitHub entra por federação e
  # impersona a mam-terraform. Os nomes vêm das variáveis do repositório (README).
  publicar:
    # Sem as variáveis (configuração única do README), o job é pulado, e não falha.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WORKLOAD_IDENTITY_PROVIDER != ''
    needs: [verificar, terraform, loop-afk, gitleaks]
    runs-on: ubuntu-26.04
    # Um deploy por vez: o estado do Terraform e a tag do commit não se disputam. A
    # fila não garante a ordem, então o passo `ponta` garante que nunca se volta atrás.
    concurrency:
      group: publicar-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      BUCKET_ESTADO_TF: ${{ vars.BUCKET_ESTADO_TF }}
      GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_IMPERSONATE_SERVICE_ACCOUNT }}
      ADMINS_EMERGENCIA: ${{ vars.ADMINS_EMERGENCIA }}
      CLOUDSDK_ACTIVE_CONFIG_NAME: default
      TF_IN_AUTOMATION: "1"
      # À mão, cada apply pede confirmação; aqui o CI verde é a aprovação.
      TF_CLI_ARGS_apply: -auto-approve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Só publica a ponta da main: um commit já superado, cujo CI terminou depois
      # do seguinte, publicaria código antigo por cima. O run da ponta publica.
      - id: ponta
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo publica=1 >> "$GITHUB_OUTPUT"
          else
            echo "Superado por $(git rev-parse --short FETCH_HEAD) na main; não publica."
          fi
      # Sem service_account: o token federado só serve para impersonar a mam-terraform.
      # Este job publica, então as actions de terceiros vão pelo SHA, não pela tag.
      - if: steps.ponta.outputs.publica
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      - if: steps.ponta.outputs.publica
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # O wrapper suja a saída de `terraform output -raw`, que o script lê.
          terraform_wrapper: false
      - if: steps.ponta.outputs.publica
        run: make deploy-dev
