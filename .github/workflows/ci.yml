name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instala o ffmpeg (os testes do validador usam o real)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Sobe os emuladores do Firestore e do Storage (testes de api/tests/test_nuvem.py)
        run: |
          # Sem -public-host, o fake-gcs só atende URL assinada com Host storage.googleapis.com.
          docker run -d --name fake-gcs -p 4443:4443 fsouza/fake-gcs-server:1.52.2 \
            -scheme http -port 4443 -public-host localhost:4443
          docker run -d --name firestore -p 8686:8686 google/cloud-sdk:591.0.0-emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8686
          for i in $(seq 60); do
            curl -sf localhost:4443/storage/v1/b && curl -sf localhost:8686 && exit 0
            sleep 2
          done
          echo "Emuladores não subiram em 2 minutos" && docker logs fake-gcs; docker logs firestore; exit 1
      - run: make instalar verificar
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8686
          STORAGE_EMULATOR_HOST: http://localhost:4443

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra validate

  loop-afk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make testar-afk

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instala o gitleaks 8.30.1
        run: |
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c
          tar xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner
