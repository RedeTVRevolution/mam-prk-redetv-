name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Backend, front e imagem rodam em jobs paralelos: o `publicar` espera todos.
  backend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: ./.github/actions/emuladores
      # Sem ffmpeg na máquina, o verificar pula os testes do validador; o job `imagem`
      # os roda com o ffmpeg da produção.
      - run: uv sync --locked
      - run: make verificar-api
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8686
          STORAGE_EMULATOR_HOST: http://localhost:4443

  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: make verificar-web

  # Só roda de fato quando mudam os arquivos que o `testar-na-imagem` usa. Pulado, o job
  # termina verde (os passos são pulados, não o job), para não travar o `publicar`.
  # Os módulos de api/ entram todos: a imagem copia o pacote inteiro e o validador os
  # importa por tabela (jobs, nuvem); um import que só quebra na imagem passaria.
  imagem:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: mudou
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Sem base conhecida (primeiro push do branch) ou sem ela no clone: roda.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "mudou=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qxE \
            'Dockerfile|\.dockerignore|Makefile|pyproject\.toml|uv\.lock|\.github/workflows/ci\.yml|\.github/actions/emuladores/action\.yml|api/[^/]+\.py|api/tests/(__init__|test_validador|test_validacao_job)\.py'; then
            echo "mudou=1" >> "$GITHUB_OUTPUT"
          else
            echo "Nada que o testar-na-imagem use mudou; pulado."
          fi
      - if: steps.mudou.outputs.mudou
        uses: ./.github/actions/emuladores
      - if: steps.mudou.outputs.mudou
        run: make testar-na-imagem
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8686
          STORAGE_EMULATOR_HOST: http://localhost:4443

  terraform:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra validate
      # Plano do dev com o provider simulado (infra/plano_simulado.tftest.hcl): pega erro que só
      # aparece no plan, como tipos diferentes numa condicional, sem credencial de nuvem.
      - run: terraform -chdir=infra test
      # O pré-voo do apply (api/pre_voo.py) roda no `publicar` com o python3 do runner, sem
      # instalar nada: este job, na mesma imagem e também sem Python instalado, prova que ele roda.
      - run: echo '{"resource_changes":[]}' >"$RUNNER_TEMP/plano.json" && python3 -m api.pre_voo "$RUNNER_TEMP/plano.json"
      - run: terraform -chdir=infra/ambientes/prod init -backend=false -input=false
      - run: terraform -chdir=infra/ambientes/prod fmt -check
      - run: terraform -chdir=infra/ambientes/prod validate

  loop-afk:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/afk/package-lock.json
      - run: make testar-afk

  gitleaks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instala o gitleaks 8.30.1
        run: |
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c
          tar xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner

  # Diz ao `publicar` se o push mudou algo que vai para a nuvem (scripts/vai-para-a-nuvem.sh):
  # um push só de documentação não monta imagem nem roda o apply. Não entra no ruleset da main.
  # Na dúvida, publica: sem base conhecida (primeiro push do branch, push forçado) ou com o
  # passo caído, o `pula` fica vazio e o `publicar` roda.
  mudou-o-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    outputs:
      pula: ${{ steps.mudou.outputs.pula }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: mudou
        continue-on-error: true
        env:
          BASE: ${{ github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Sem base conhecida; publica."; exit 0
          fi
          MUDOU=$(git -c core.quotePath=false diff --name-only "$BASE" "$GITHUB_SHA")
          if scripts/vai-para-a-nuvem.sh <<<"$MUDOU"; then
            echo "Muda o que vai para a nuvem; publica."
          else
            echo "pula=1" >> "$GITHUB_OUTPUT"
            echo "Nada do que vai para a nuvem mudou; o publicar fica pulado."
          fi

  # CD (#71): com o CI verde num push na main, publica no dev pelo mesmo `make
  # deploy-dev` de quem publica à mão. Sem chave: o GitHub entra por federação e
  # impersona a mam-terraform. Os nomes vêm das variáveis do repositório (README).
  publicar:
    # Sem as variáveis (configuração única do README), o job é pulado, e não falha.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WORKLOAD_IDENTITY_PROVIDER != '' && needs.mudou-o-deploy.outputs.pula != '1'
    needs: [backend, web, imagem, terraform, loop-afk, gitleaks, mudou-o-deploy]
    runs-on: ubuntu-26.04
    # Um deploy por vez: o estado do Terraform e a tag do commit não se disputam. A
    # fila não garante a ordem, então o passo `ponta` garante que nunca se volta atrás.
    concurrency:
      group: publicar-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      BUCKET_ESTADO_TF: ${{ vars.BUCKET_ESTADO_TF }}
      GOOGLE_IMPERSONATE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_IMPERSONATE_SERVICE_ACCOUNT }}
      ADMINS_EMERGENCIA: ${{ vars.ADMINS_EMERGENCIA }}
      CLOUDSDK_ACTIVE_CONFIG_NAME: default
      TF_IN_AUTOMATION: "1"
      # À mão, cada apply pede confirmação; aqui o CI verde é a aprovação.
      TF_CLI_ARGS_apply: -auto-approve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Só publica a ponta da main: um commit já superado, cujo CI terminou depois
      # do seguinte, publicaria código antigo por cima. O run da ponta publica. Se o que
      # veio depois não vai para a nuvem (só documentação), o run da ponta fica pulado
      # (mudou-o-deploy), e este publica: o que vai para a nuvem é igual ao da ponta.
      - id: ponta
        run: |
          git fetch -q origin main
          PONTA=$(git rev-parse FETCH_HEAD)
          DEPOIS=$(git -c core.quotePath=false diff --name-only "$GITHUB_SHA" "$PONTA")
          if [ "$PONTA" = "$GITHUB_SHA" ] || ! scripts/vai-para-a-nuvem.sh <<<"$DEPOIS"; then
            echo publica=1 >> "$GITHUB_OUTPUT"
          else
            echo "Superado por $(git rev-parse --short "$PONTA") na main; não publica."
          fi
      # Sem service_account: o token federado só serve para impersonar a mam-terraform.
      # Este job publica, então as actions de terceiros vão pelo SHA, não pela tag.
      - if: steps.ponta.outputs.publica
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      - if: steps.ponta.outputs.publica
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # O wrapper suja a saída de `terraform output -raw`, que o script lê.
          terraform_wrapper: false
      - if: steps.ponta.outputs.publica
        run: make deploy-dev
